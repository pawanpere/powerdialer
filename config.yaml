# Power dialer list-prep configuration
# Stack: VICIdial (self-hosted) + Telnyx elastic SIP trunk

campaign:
  name: PPAP
  # VICIdial list IDs. Create these in VICIdial admin BEFORE loading.
  # With --split-agents N the direct list occupies list_id_direct .. +N-1
  # (101-105 for 5 seats), so toll-free sits in its own range to avoid collision.
  list_id_direct: 101      # direct-dial numbers -> one list per agent seat
  list_id_tollfree: 200    # switchboard/toll-free -> gatekeeper list, separate script
  source_id: pxlkraft      # provenance tag, shows in VICIdial reporting

regions:
  # US/CA only. Anything else is rejected with reason=out_of_region.
  allowed: [US, CA]

# Enforced by VICIdial's per-campaign "Local Call Time" using the lead's
# gmt_offset_now. Listed here so prep-time reporting matches dial-time reality.
calling_hours:
  US:
    weekday: ["08:00", "21:00"]   # federal TCPA floor, recipient local time
    weekend: ["08:00", "21:00"]
  CA:
    weekday: ["09:00", "21:30"]   # CRTC Unsolicited Telecom Rules
    weekend: ["10:00", "18:00"]   # tighter than US - do not copy the weekday window

# Retry cadence for the browser dialer (dialer/policy.py). Six tries across
# three weeks, never twice in one day, never the same weekday twice running,
# mornings and afternoons alternating so a 9am no-answer is tried at 4pm next.
retry:
  max_attempts: 6
  gap_days: [2, 3, 4, 5, 6]        # days to wait after attempt 1, 2, 3, 4, 5
  voicemail_attempts: [1, 3, 5]    # leave a message on these tries only
  recall_suppression_days: 30      # list prep: do not reload a lead dialed within N days
  # After attempt 6 with no DM the lead closes as EXHAUSTED, is tagged
  # email_only, and lands in out/exhausted_for_email.csv.

numbers:
  max_dials_per_number_per_day: 150   # hard stop, enforced by the dialer
  warmup_days: 21
  warmup_dials_per_day: 30            # cap while a number is inside its warm-up
  park_below_pickup_rate: 0.15        # auto-park: 7-day pickup rate under this ...
  park_min_dials: 100                 # ... across at least this many dials
  spam_flag_pickup_rate: 0.20         # softer flag: under this across spam_flag_min_dials
  spam_flag_min_dials: 50
  # Local presence. The dialer shows the number whose area code matches the
  # lead, else one in the lead's state, else round robin. Every number here
  # must also be on the Twilio /dial Function's CALLER_IDS allow-list
  # (dialer/TWILIO.md). warmup_start is optional: without it the warm-up
  # runs from the number's first dial here.
  pool:
    - {number: "+19893751429", area_code: "989", state: MI, warmup_start: 2026-09-16}
  # Reputation checks opened from the Numbers rail. {number} is the 10 digits.
  spam_check_urls:
    - {label: Free Caller Registry, url: "https://www.freecallerregistry.com/fcr/"}
    - {label: Search the number, url: "https://www.google.com/search?q=%22{number}%22+spam+OR+scam+OR+robocall"}

# Weighted priority score -> `rank`. The queue dials DOWN RANK, so the best-fit
# shops get called in the first power window of the day.
#
# Who we want: owners, presidents, GMs and quality managers at US machining,
# stamping, forging, casting and fab shops with 10 to 200 people, ideally
# supplying automotive or aerospace, where PPAP / AS9102 paperwork is a weekly
# chore. Only features that VARY across the list are weighted: a weight every
# lead earns is a constant, and a constant ranks nothing.
scoring:
  # Raw scores become a 0-99 percentile rank within each load, so the queue is
  # always well spread however a single list is distributed.
  normalize_to_percentile: true
  max_rank: 100

  title_seniority:
    owner: 15                  # owner|president|ceo|founder
    ops: 12                    # gm|general manager|plant manager|vp operations|vp engineering
    quality: 15                # quality manager|quality engineer|quality director
    other: 0
  company_size_fit:            # employee count; lower bound of each band
    unknown: 4
    "1": 2                     # 1-9      too small to have PPAP volume
    "10": 10                   # 10-24
    "25": 15                   # 25-99    best fit
    "100": 12                  # 100-199
    "200": 5                   # 200-499  usually has a quality department
    "500": 0                   # 500+     rejected at prep anyway
  process_keywords:            # in company name, process, industry or notes
    points: 10
    words: [machining, precision, cnc, stamping, forging, casting, foundry, "fab*",
            "tool & die", tooling, industries, manufacturing]
  auto_aero_keywords:          # customers who demand PPAP / FAI packages
    points: 8
    words: [automotive, "tier 2", iatf, as9100, aerospace, medical]
  linkedin_accepted: 20        # li_status = accepted: they already know the name
  engaged: 40                  # opened/replied to the cold email: highest signal

  # Hard reject at prep (reason `itar`). We cannot take export-controlled drawings.
  itar_defense:
    words: [defense, defence, itar, dod, military]

# List-prep rejects beyond phone validity, region, DNC and ITAR.
prep:
  max_employees: 500       # bigger shops have a quality department; reason `too_large`
  # One contact per company survives: the best-scored, a direct line beating
  # a switchboard on a tie. The rest are rejected as `duplicate_company`.

suppression:
  dnc_file: dnc.csv                  # internal do-not-call, checked at prep AND dial time
  called_log: cache/called_log.csv   # dialed-recently suppression
  # Optional: CSV/JSON of emails or domains that engaged with the email sequence.
  # Export from PlusVibe. Leave null until available.
  engagement_file: null

compliance:
  # VICIdial stack: the mandatory first line of every campaign script.
  # Browser dialer: never played automatically. The agent speaks from the first
  # second. The line appears as a "Say first" prompt ONLY while dialer.recording
  # is true, because recording without it breaks all-party-consent law in
  # CA/FL/IL/MD/MA/MI/MT/NV/NH/OR/PA/WA/CT/DE.
  recording_disclosure: >-
    Quick heads up, this call is recorded.
  # Every call is recorded from pickup with no disclosure (your choice,
  # 5 Oct 2026). These states require everyone on the call to consent, so a
  # recording there without telling them can be sued over (California: up to
  # $5,000 a call). Set hold_recording_in_all_party_states: true to make the
  # cockpit hold the recording for leads in these states (or with no state on
  # file) until you've said the line above and pressed R.
  all_party_consent_states: [CA, CT, DE, FL, IL, MD, MA, MI, MT, NV, NH, OR, PA, WA]
  hold_recording_in_all_party_states: false
  # CRTC requires clear identification at call start for Canadian numbers.
  identify_company_on_connect: true
  opt_out_honored_within_days: 10    # FCC revocation rule: 10 business days (US)
  ca_opt_out_honored_within_days: 14 # CRTC internal DNC
  log_retention_years: 5

  # National DNC scrub. Path to a file of numbers you may not call: one per
  # line, or a CSV with a phone column, any format. Checked at list prep
  # (reject reason `national_dnc`) AND again at dial time, so a list prepped
  # before the latest scrub file still cannot slip a number through. A hit at
  # dial time moves the lead to the internal do-not-call list. null = off.
  dnc_scrub_file: null

  # Calls to a number flagged as a mobile (line_type = mobile from the Telnyx
  # lookup or the list, or a lead whose only number was its mobile) are
  # blocked at dial time. Autodialed or prerecorded calls to mobiles need
  # prior consent under the TCPA. Turn on only with counsel's say-so.
  allow_mobile: false

# ---------------------------------------------------------------------------
# Browser dialer (dialer/serve.py + dialer/app.js). Everything below is read
# at server start and handed to the agent screen via /api/config: edit here,
# restart, no code changes. Omit a key to keep the built-in default.
# ---------------------------------------------------------------------------
dialer:
  daily_goal: 100            # the "today" progress bar; the hard cap is numbers.max_dials_per_number_per_day
  autodial_delay_sec: 3      # power session: pause between wrap-up and the next dial
  recording: true            # every call is recorded from pickup through Twilio's API (two channels:
                             # you and them). See compliance.hold_recording_in_all_party_states.

  # Seats offered by the "Who's dialing?" picker. id is the carrier client
  # identity (set AGENT_CLIENT on the Twilio /inbound Function to match so
  # return calls ring this seat); name is what the scripts say.
  agents:
    - {id: pawan, name: Pawan}

  pause_reasons: [Break, Lunch, Meeting, Admin / follow-ups, Coaching]

  # Prospect-local calling windows for COLD dials. Power windows are dialed
  # first, then secondary. Lunch (11:30 to 13:30) is never dialed cold.
  # `hard` is the outer limit for anything at all, requested callbacks
  # included. Because every window follows the prospect's own clock, the queue
  # walks ET, CT, MT, PT by itself as the day moves.
  windows:
    power:     [["08:15", "10:15"], ["15:45", "17:45"]]
    secondary: [["10:15", "11:30"], ["13:30", "15:45"]]
    hard:      ["08:00", "18:00"]
    weekends:  false

  # Start-session defaults. The session ends itself at whichever comes first.
  session:
    target_dials: 100
    target_minutes: 90
  # Dials a day the target strip aims for, when a campaign doesn't set its own
  # (each campaign can, under Campaigns > Edit).
  daily_target: 150
  default_script_version: v1

  # The day that stats, caps and "same day" rules run on. You dial US business
  # hours from India, which crosses midnight in both IST and UTC, so the day
  # is the prospects' day.
  stats_timezone: America/New_York

  # ---- wrap-up level 1: what happened (keys 1-9 then 0, in this order) -------
  # kind:     final    -> lead is done
  #           retry    -> back in the queue on the retry cadence
  #           callback -> asks for a time, jumps the queue when due
  #           dnc      -> confirms, then blocks the number for good
  # Funnel flags, stamped onto the call when it is saved:
  #   connect   someone picked up            (Pickups)
  #   dm        the decision maker was on the line
  #   pitched   the DM heard the pull pitch  (DM's Pitched)
  #   resonated they admitted the problem    (Resonations)
  #   offered   you asked for the meeting    (can also be ticked at level 2)
  #   booked    a call is on the calendar    (Call Booked)
  # tone: good | info | plain | danger  (button styling only)
  # CALLBACK, DNC and BOOKED are load-bearing keys.
  outcomes:
    - {key: BOOKED,       label: Booked call,                 kind: final,    connect: true,  dm: true, pitched: true, resonated: true, offered: true, booked: true, tone: good}
    - {key: CALLBACK,     label: Callback (DM),               kind: callback, connect: true,  dm: true, pitched: true, tone: info}
    - {key: RESONATED_NO, label: "Resonated, no book",        kind: retry,    connect: true,  dm: true, pitched: true, resonated: true, offered: true, tone: info}
    - {key: PITCHED_NO,   label: "Pitched, not a fit",        kind: final,    connect: true,  dm: true, pitched: true, tone: plain}
    - {key: DM_NO_PITCH,  label: "DM reached, no pitch",      kind: retry,    connect: true,  dm: true, tone: plain}
    - {key: GATEKEEPER,   label: Gatekeeper blocked,          kind: retry,    connect: true,  tone: plain}
    - {key: VOICEMAIL,    label: Voicemail left,              kind: retry,    connect: false, tone: plain}
    - {key: NO_ANSWER,    label: No answer / busy,            kind: retry,    connect: false, tone: plain}
    - {key: BAD_NUMBER,   label: Wrong number / disconnected, kind: final,    connect: false, tone: plain}
    - {key: DNC,          label: Do not call,                 kind: dnc,      connect: true,  tone: danger}

  # ---- wrap-up level 2: only when someone picked up, all optional -------------
  objection_tags:
    - {key: NOT_INTERESTED,  label: Not interested}
    - {key: BUSY,            label: Busy}
    - {key: SEND_EMAIL,      label: Send me an email}
    - {key: NO_BUDGET,       label: No budget}
    - {key: FREE_TRIAL_ASK,  label: Free trial ask}
    - {key: ALREADY_HAVE,    label: Already have someone}
    - {key: WHAT_DO_YOU_DO,  label: What do you do}
    - {key: ITAR,            label: ITAR}
    - {key: NO_PPAP_VOLUME,  label: No PPAP volume}
    - {key: OTHER,           label: Other}

  # Rate targets shown next to each rate. good = at or above target,
  # warn = within 75% of it, bad = below. Rates stay grey under min_sample.
  targets:
    abr: 0.02                  # bookings / dials: the star metric
    abr_benchmark: 0.045       # what the team benchmark runs at
    pickup: 0.20               # pickups / dials; under this on 50+ dials = number likely spam-labelled
    dm_reach: 0.50             # DMs pitched / pickups
    offer: 0.33                # offered / resonations
    sur: 0.60                  # showed / booked calls that have come due
    scr: 0.25                  # sales / showed
    conversations_per_day: 10  # beginner star metric: unique effective conversations
    min_sample: 10

  # Fired when a BOOKED call is saved, so something outside the app (Zapier,
  # Make, n8n) can create the Calendly or Google invite. POST, JSON body with
  # the lead, the time in UTC and on their clock, the pain line and the caller.
  # Every attempt is logged in the webhook_log table. null = off.
  booking_webhook_url: null
  calendly_url: "https://calendly.com/pxlkraftt/discovery-call"

  # ---------------------------------------------------------------------------
  # SCRIPTS. Every word the cockpit shows lives here.
  # Tokens: {first} {last} {dm_first} {company} {title} {process} {oem} {agent}
  #         {city} {state} {email} {pain} {callback_number} {calendly}
  #   {?oem}...{/oem}   renders only when the lead has that value
  #   {!oem}...{/oem}   renders only when it does not
  #   **bold** is supported. No em dashes anywhere: they read as AI.
  #
  # tree.<version>.order   the step ids of each flow, in order. Arrow keys walk
  #                        a flow; steps whose `when` / `unless` token test or
  #                        `attempts` list fails for this lead are skipped.
  # step keys:  title, say (first line is the main one, the rest are
  #             alternatives), cue (stage direction), chips (tap to reveal an
  #             answer), prompts (questions to pick from), rules (grey
  #             reminders), branches ([{label, to, outcome}]), action (book).
  # A version may `extends:` another and override single steps, which is how
  # you A/B one change at a time: sessions pick a version, stats split by it.
  # ---------------------------------------------------------------------------
  scripts:
    tree:
      v1:
        order:
          call: [gatekeeper_known, gatekeeper_unknown, permission, pitch, negative, qualify, ask, book]
          voicemail: [voicemail_cutoff, voicemail_plain]
          inbound: [inbound]
        steps:
          gatekeeper_known:
            title: Gatekeeper
            when: dm_name
            say:
              - "Hi, is {dm_first} in?"
              - "{dm_first} please."
              - "Hey, it's {agent}, calling back for {dm_first}, is he around?"
            cue: "Then silence. Assumptive close: \"Great, I'll hold, thanks.\""
            chips: &gatekeeper_chips
              - {q: "Who's calling?", a: "It's {agent}."}
              - {q: "What's it regarding?", a: "He'll know what it's about.   /   An email I sent.   /   Personal business."}
              - {q: "Will he know what it's about?", a: "He'd better."}
              - {q: "Where are you calling from?", a: "PXL Kraft, he'll be familiar with us."}
              - {q: "Third question from them", a: "Yeah I'm happy to discuss all that, I need to get to another call in a minute, what's the best way to reach {dm_first} later?"}
            rules: &gatekeeper_rules
              - Never pitch the gatekeeper.
              - First names only.
              - Short statement, then silence.
              - No upward inflection.
              - Answer two questions at most, then ask for the best way to reach {dm_first} later.
          gatekeeper_unknown:
            title: Gatekeeper
            unless: dm_name
            say:
              - "Hey, I'm calling about the PPAP paperwork on your {?process}{process} {/process}parts, got a couple of questions. Who would I need to speak with?"
            cue: "If they offer themselves: \"Are you the owner at {company}?\"  If not: \"Better I speak with the owner, what's their name?\"  Put the name in the Decision maker field."
            chips: *gatekeeper_chips
            rules: *gatekeeper_rules
          permission:
            title: Permission
            say:
              - "Hi {dm_first}, I'll be totally honest with you, this is a sales call. Would you like to hang up, or let me have thirty seconds and then decide?"
            cue: "(laugh)  \"Let me have thirty seconds and if you don't want to talk to me at the end we end it there. Sound fair?\""
          pitch:
            title: Pull pitch, 30 seconds
            say:
              - "OK so look {dm_first}, I'm typically invited in by owners of {?process}{process} {/process}shops that are doing fine on parts but honest enough to admit the PPAP and FAI paperwork is a bottleneck. Usually it's one of three things. The quality guy loses two or three days per package ballooning the print and building the control plan, so the package lands a week late. Or the OEM keeps kicking it back on element 9 or the PSW and nobody's sure why. Or there's just no one to do it, so the owner does it at night. I get the feeling you're going to tell me none of that applies at {company}?"
            branches:
              - {label: "\"We're all set\" / \"not interested\"", to: negative}
              - {label: "They lean in", to: qualify}
          negative:
            title: Branch, negative
            say:
              - "Sure, quick question, when someone says that it usually means the PPAPs go out on time every time. I'm assuming you never have one land late?"
              - "Usually late packages come from one of those three, the hours, the rejections, or no one to do it. Which is it for you?"
            cue: "First line always. If they say never: end politely. If they admit peaks: second line, then Qualify."
            branches:
              - {label: "Never late: end politely", outcome: PITCHED_NO}
              - {label: "They admit peaks", to: qualify}
          qualify:
            title: Qualify
            capture: true
            say:
              - "Of those three, hours, rejections, or nobody to do it, if you could wave a wand and fix one at {company}, which would it be?"
              - "OK, I've had my thirty seconds, mind if we talk for one more minute?"
              - "Great question and we'll get to that, right now this is about you and whether I can actually help. Quick one..."
            cue: "Mirror their answer back word for word, same tone. Then line two. Line three only if they ask what you do. Type their words into Pain."
            prompts:
              - "When you say {?pain}\"{pain}\"{/pain}{!pain}that{/pain}, give me an example?"
              - "How long has that been going on?"
              - "What's it costing you a month, roughly?"
              - "What have you tried?"
              - "I'm guessing that worked?"
            rules:
              - Two pain questions at most.
              - "Also get: PPAPs per year, which OEMs, any ITAR work."
              - "ITAR work: end the call. We cannot take export-controlled drawings."
            branches:
              - {label: "They do ITAR work: end", outcome: PITCHED_NO, tag: ITAR}
          ask:
            title: Ask
            say:
              - "So {dm_first}, if I told you I fix exactly that, and I've done it for {?process}{process} {/process}shops in your spot, would that be something you want to explore?"
              - "Let's pretend I can take {?pain}{pain}{/pain}{!pain}that{/pain} off your plate: your drawing goes in, the print is ballooned in seconds, and the whole PPAP comes back in minutes, in your customer's template, with every characteristic checked by our engineer before it's released. Any reason you wouldn't take fifteen minutes to see it on one of your own drawings?"
            cue: "No prices on this call. The only goal is the fifteen minutes."
          book:
            title: Book
            action: book
            say:
              - "I'll send the invite to {?email}{email}{/email}{!email}your email{/email}, that's right isn't it?"
              - "Any reason you'd want to cancel? You're not going to hang up and think what have I done, I agreed to meet a salesperson?"
            cue: "Only after a yes. Set the time on THEIR clock, tick each mini-contract as you say it, then confirm the email."
            contracts:
              - "If by the end you don't want to move forward, you OK telling me no?"
              - "And if I can't help, I'll say so, you won't be upset?"
              - "If neither of us says no, we spend a few minutes on a next step?"
          voicemail_cutoff:
            title: Voicemail, cut off
            attempts: [1, 5]
            say:
              - "Hey {dm_first}, it's {agent}, you can get me back on {callback_number}, that's {callback_number}. Pretty urgent about the..."
            cue: "Hang up mid-sentence. The number you read out must be the caller ID shown in the call bar."
          voicemail_plain:
            title: Voicemail, plain
            attempts: [3]
            say:
              - "Hey {dm_first}, it's {agent} with PXL Kraft. I'm calling about the PPAP paperwork on your {?process}{process} {/process}parts. You can get me back on {callback_number}, that's {callback_number}. Thanks."
          inbound:
            title: They called back
            say:
              - "{agent} Pere."
              - "You got a voicemail from me, I got cut off."
              - "Ah yeah {dm_first}, I've been trying to get hold of you. I'll be honest, I've got something to sell you. Hang up, or give me 30 seconds and then decide?"
            cue: "Answer with your name only. Then straight into the pull pitch."
            branches:
              - {label: "They give you thirty seconds", to: pitch}
      # Example variant so the A/B split has something to split. Same tree, the
      # pitch leads with the rejection pain instead of the hours. Edit or delete.
      v2:
        extends: v1
        steps:
          pitch:
            title: Pull pitch, 30 seconds (rejections first)
            say:
              - "OK so look {dm_first}, I'm typically invited in by owners of {?process}{process} {/process}shops that make good parts but keep getting the PPAP kicked back. Usually it's one of three things. The OEM bounces it on element 9 or the PSW and nobody's sure why. Or the quality guy loses two or three days per package, so it lands a week late. Or there's just no one to do it, so the owner does it at night. I get the feeling you're going to tell me none of that applies at {company}?"

    # Objections panel (hotkey o). Imperium three-part shape: anchor, pattern
    # disrupt, question. `tag` links a card to a level-2 objection chip, so
    # "heard it" on the card ticks the chip. Edits made in the app are kept in
    # DATA_DIR/objections.json and override these by key.
    objection_rule: "Ignore a knee-jerk objection the first time (\"thought so, let me ask...\") and only use the rebuttal if it comes back a second time. Handle at least two objections before ending. After a third, get an email and end."
    objections:
      - key: not_interested
        title: Not interested
        tag: NOT_INTERESTED
        anchor: "Of course you're not, you don't have enough information to be. You don't know me and I don't know you."
        disrupt: "When I called I knew you wouldn't be until you saw what I've got."
        question: "Quick one, who builds the PPAP package at {company} today?"
      - key: busy
        title: Busy
        tag: BUSY
        anchor: "I know you're busy, and because you're busy this never gets done."
        disrupt: "Let me ask this..."
        question: "How many PPAPs a year are you sending out?"
      - key: send_email
        title: Send me an email
        tag: SEND_EMAIL
        anchor: "Happy to, doing it right now."
        disrupt: "So I include the right thing..."
        question: "Is the bigger question whether the AI actually catches every characteristic, or who'd review it on your side?"
      - key: no_budget
        title: No budget
        tag: NO_BUDGET
        anchor: "Makes sense, you didn't call me, I called you, why would you have a budget?"
        disrupt: "Let me ask this..."
        question: "What does a late package cost you{?oem} with {oem}{/oem}?"
      - key: free_trial
        title: Free trial ask
        tag: FREE_TRIAL_ASK
        anchor: "Love that, hats off."
        disrupt: "People only ask that because they think they won't use it, it won't work, or they've been burned before."
        question: "Which one is it for you?"
        note: "Then say yes: the first package is free after the call, that's the whole point of the call."
      - key: already_have
        title: Already have someone / we do it in-house
        tag: ALREADY_HAVE
        anchor: "Almost everyone I talk to does."
        disrupt: "I'm not saying switch. My goal is just enough info to see if there's an alternative, five minutes, and if it isn't a fit we both call it."
        question: "Fair enough?"
      - key: what_do_you_do
        title: What do you do
        tag: WHAT_DO_YOU_DO
        anchor: "You send the drawing and your routing, and the full PPAP comes back in minutes in your customer's template. Our engineer checks every characteristic before it's released, and the first one is a free trial."
        disrupt: "(one line only, then straight to a question)"
        question: "How long does one take your team today?"
      - key: calls_all_the_time
        title: I get calls like this all the time
        anchor: "Me too, half the country has my number."
        disrupt: "I don't know if what we do would help yet, we just met."
        question: "Who does your PPAP paperwork right now?"
      - key: are_you_selling
        title: Are you a client / are you selling
        anchor: "You sniffed that out fast. Not selling anything yet, just introducing myself."
        disrupt: "Let me ask this..."
        question: "Who builds the PPAP package at {company} today?"

    # One-click follow-ups after BOOKED and RESONATED_NO. Subject is their
    # first name only.
    emails:
      booked_confirm:
        subject: "{dm_first}"
        body: |
          {dm_first},

          Good talking just now. You're on my calendar for {booked_when}, your time, fifteen minutes. The invite is on its way to this address.

          You told me: {?pain}"{pain}"{/pain}{!pain}the PPAP paperwork is the bottleneck{/pain}. That is exactly what we will look at. If you have a recent drawing handy, bring it and I will show you the package built from it while we talk.

          If anything moves, this link reschedules in one click: {calendly}

          {agent}
          PXL Kraft
      no_book_intrigue:
